name: Android APK

# Builds the APK on every push to main and publishes it on the GitHub Release
# named "latest": https://github.com/<owner>/<repo>/releases/tag/latest
#
# Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY       app config (via --dart-define)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD      fixed release signing key
# Without the four signing secrets a DEBUG test build is published instead.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_check:
        description: 'Only check the release build with a throwaway key (publishes nothing)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Visible name (GitHub turns spaces in asset names into dots, so dashes).
      APP_NAME: Meenakshi Amman Hindi Classes
      APK_NAME: Meenakshi-Amman-Hindi-Classes.apk
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Prepare signing key
        env:
          RELEASE_CHECK: ${{ inputs.release_check }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/gyanify-release.jks
            {
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'storeFile=gyanify-release.jks\n'
            } > android/key.properties
            echo "BUILD_KIND=release" >> "$GITHUB_ENV"
            echo "Release signing key found."
          elif [ "$RELEASE_CHECK" = true ]; then
            PW="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt -keystore android/app/gyanify-release.jks -storetype PKCS12 \
              -alias check -keyalg RSA -keysize 2048 -validity 1 -storepass "$PW" -keypass "$PW" \
              -dname "CN=Throwaway check" >/dev/null 2>&1
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=check\nstoreFile=gyanify-release.jks\n' "$PW" "$PW" > android/key.properties
            echo "BUILD_KIND=release" >> "$GITHUB_ENV"
            echo "CHECK_ONLY=yes" >> "$GITHUB_ENV"
            echo "::notice::Release check with a throwaway key. Nothing will be published."
          else
            echo "BUILD_KIND=debug" >> "$GITHUB_ENV"
            echo "::warning title=Test build::Signing secrets are missing, so this is a DEBUG test build. Students will have to uninstall it before installing the real release."
          fi

      - name: Check app config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Same rules as app/lib/main.dart, so "Connected" in the release notes is honest.
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          KEY="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')"
          case "$KEY" in
            sb_secret_*|*service_role*)
              echo "::error title=Wrong key::SUPABASE_PUBLISHABLE_KEY holds a SECRET key. Replace it with the sb_publishable_... key and rotate the secret key in Supabase."
              exit 1 ;;
          esac
          problems=""
          [ -z "$URL" ] && problems="$problems SUPABASE_URL is empty (add it as a secret or variable with exactly this name);"
          [ -z "$KEY" ] && problems="$problems SUPABASE_PUBLISHABLE_KEY is empty;"
          if [ -n "$URL" ]; then
            case "$URL" in
              https://?*) ;;
              *) problems="$problems SUPABASE_URL must start with https:// ;" ;;
            esac
            case "$URL" in *example*) problems="$problems SUPABASE_URL still contains 'example';" ;; esac
          fi
          case "$KEY" in *example*) problems="$problems SUPABASE_PUBLISHABLE_KEY still contains 'example';" ;; esac
          if [ -z "$problems" ]; then
            echo "HAS_BACKEND=yes" >> "$GITHUB_ENV"
            echo "Supabase config found for host: $(printf '%s' "$URL" | sed -E 's#^https://([^/]+).*#\1#')"
          else
            echo "HAS_BACKEND=no" >> "$GITHUB_ENV"
            echo "::warning title=No Supabase config::$problems The app will only show a 'Backend configuration is missing' screen."
          fi

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Debug test builds skip x86 emulator code to stay small enough for WhatsApp.
          EXTRA=""
          if [ "$BUILD_KIND" = debug ]; then EXTRA="--target-platform=android-arm,android-arm64"; fi
          flutter build apk "--$BUILD_KIND" $EXTRA \
            --dart-define=SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')" \
            --dart-define=SUPABASE_AUTH_REDIRECT_URL=gyanify://login-callback/ \
            --build-name="1.0.$GITHUB_RUN_NUMBER" \
            --build-number="$GITHUB_RUN_NUMBER"
          cp "build/app/outputs/flutter-apk/app-$BUILD_KIND.apk" "$RUNNER_TEMP/$APK_NAME"
          rm -f android/key.properties android/app/gyanify-release.jks

      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/$APK_NAME" | tee "$RUNNER_TEMP/signature.txt"
          cd "$RUNNER_TEMP" && sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          ls -l "$APK_NAME"

      - name: Publish to the "latest" release
        if: env.CHECK_ONLY != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CERT="$(grep -m1 'SHA-256 digest' "$RUNNER_TEMP/signature.txt" | sed 's/.*: //')"
          if [ "$BUILD_KIND" = release ]; then
            KIND="Release build (fixed signing key, students can update without uninstalling)."
          else
            KIND="TEST BUILD (debug). Signing secrets are not set yet. Each test build has a different key, so uninstall the old one before installing."
          fi
          if [ "$HAS_BACKEND" = yes ]; then
            BACKEND="Connected to Supabase."
          else
            BACKEND="NOT connected to Supabase (secrets missing). The app only shows a setup notice."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **$APP_NAME 1.0.$GITHUB_RUN_NUMBER** from commit \`${GITHUB_SHA::7}\`

          - $KIND
          - $BACKEND
          - Signing certificate SHA-256: \`$CERT\`
          - APK SHA-256: \`$(cut -d' ' -f1 "$RUNNER_TEMP/$APK_NAME.sha256")\`

          Download **$APK_NAME** below, then send that file on WhatsApp.
          EOF
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256" \
            --title latest --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "## APK published" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
